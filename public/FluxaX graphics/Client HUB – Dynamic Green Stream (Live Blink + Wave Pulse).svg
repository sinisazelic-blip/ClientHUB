<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" id="clienthub-icon">
  <defs>
    <style>
      /* Pulsiranje zelene 'Live' lampice */
      @keyframes greenLiveBlink {
        0%, 100% {
          opacity: 0.35;
          filter: drop-shadow(0 0 2px rgba(0, 230, 118, 0.4));
        }
        50% {
          opacity: 1;
          filter: drop-shadow(0 0 16px rgba(0, 230, 118, 0.95));
        }
      }

      /* Širenje i pulsiranje mrežnih valova u ritmu prenosa */
      @keyframes wavePulse {
        0%, 100% {
          opacity: 0.2;
          transform: scale(0.98);
          transform-origin: 399px 151px;
        }
        50% {
          opacity: 0.85;
          transform: scale(1.02);
          transform-origin: 399px 151px;
        }
      }

      #green-live-bulb {
        animation: greenLiveBlink 1.2s infinite ease-in-out;
      }

      #live-waves {
        animation: wavePulse 1.2s infinite ease-in-out;
      }
    </style>

    <linearGradient id="hubLightBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e8edf2" />
    </linearGradient>

    <!-- Pro-Audio Zeleni "Live Stream" LED gradijent -->
    <radialGradient id="greenLedGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#b9f6ca" />
      <stop offset="40%" stop-color="#00e676" />
      <stop offset="100%" stop-color="#007e33" />
    </radialGradient>
  </defs>

  <!-- Baza ikone -->
  <rect width="512" height="512" rx="115" ry="115" fill="url(#hubLightBase)" stroke="#cdd6df" stroke-width="3" />

  <!-- Dinamički valovi koji pulsiraju zajedno sa diodom -->
  <g id="live-waves" stroke="#00c853" fill="none" stroke-linecap="round">
    <circle cx="399" cy="151" r="72" stroke-width="6.5" />
    <circle cx="399" cy="151" r="132" stroke-width="5.5" opacity="0.75" />
    <circle cx="399" cy="151" r="198" stroke-width="4.5" stroke-dasharray="18,12" opacity="0.5" />
    <circle cx="399" cy="151" r="270" stroke-width="3.5" opacity="0.3" />
    <!-- Satelitske točke -->
    <circle cx="309" cy="249" r="10" fill="#00e676" stroke="#ffffff" stroke-width="3" />
    <circle cx="226" cy="339" r="8.5" fill="#00e676" stroke="#ffffff" stroke-width="2.5" />
  </g>

  <!-- Monogram FX -->
  <g id="monogram">
    <path d="M 90 83 H 263 V 163 H 162 V 223 H 245 V 303 H 162 V 429 H 90 Z" fill="#1b1e22" />
    <polygon points="183,169 248,169 416,429 351,429" fill="#3ea8a6" />
    <polygon points="412,169 347,169 153,429 218,429" fill="#3ea8a6" />
  </g>

  <!-- Zelena 'Online / Live Stream' LED dioda -->
  <g id="green-live-bulb">
    <circle cx="399" cy="151" r="33" fill="url(#greenLedGrad)" stroke="#ffffff" stroke-width="3.5" />
    <ellipse cx="391" cy="142" rx="10" ry="6" fill="#ffffff" opacity="0.8" />
  </g>
</svg>